name: release vellum-cli

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Semver to publish (e.g. 0.1.0)"
        required: true
        type: string
      tag:
        description: "npm dist-tag"
        required: true
        type: choice
        default: latest
        options:
          - latest
          - next
      dry_run:
        description: "Run npm publish --dry-run; skip git tag/push"
        required: false
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      VERSION: ${{ inputs.version }}
      NPM_TAG: ${{ inputs.tag }}
      DRY_RUN: ${{ inputs.dry_run }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          # GITHUB_TOKEN cannot clone sibling private org repos (e.g. libs).
          # Submodules are initialized in the next step with KHORALABS_SUBMODULES_TOKEN.

      - name: init submodules
        env:
          # Fine-grained PAT (or classic repo-scoped) with Contents: Read on private
          # khoralabs/* submodule remotes (libs, relay, obp, …).
          TOKEN: ${{ secrets.KHORALABS_SUBMODULES_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "${TOKEN:-}" ]; then
            echo "::error::KHORALABS_SUBMODULES_TOKEN secret is empty or unset"
            exit 1
          fi
          # scp-style git@host:path URLs often skip url.insteadOf; rewrite to HTTPS first.
          sed -i 's|git@github.com:|https://github.com/|g' .gitmodules
          git config --global url."https://x-access-token:${TOKEN}@github.com/".insteadOf "https://github.com/"
          git submodule sync --recursive
          git submodule update --init --recursive

      - name: verify submodules
        run: |
          set -euo pipefail
          test -f vendor/obp/packages/nbc/package.json
          test -f vendor/relay/packages/relay/package.json
          test -f vendor/libs/packages/cli-kit/package.json

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: install
        run: bun install --frozen-lockfile

      - name: test
        run: bun test apps/cli apps/daemon packages/client packages/contracts packages/transport scripts/stage-vellum-release.test.ts scripts/homebrew-vellum.test.ts

      - name: build json schema
        run: bun run --cwd packages/client build:schema

      - name: cross-compile native binaries
        run: |
          set -euo pipefail
          for slug in darwin-arm64 linux-x64 linux-arm64; do
            echo "::group::cli bun-$slug"
            bun run apps/cli/scripts/build.ts "bun-$slug"
            echo "::endgroup::"
            echo "::group::daemon bun-$slug"
            bun run apps/daemon/scripts/build.ts "bun-$slug"
            echo "::endgroup::"
          done

      - name: stage release packages
        run: bun run scripts/stage-vellum-release.ts "$VERSION"

      - name: package release tarballs
        run: bun run scripts/package-vellum-release-tarballs.ts "$VERSION"

      - name: configure npm auth
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          if [ -z "${NPM_TOKEN:-}" ]; then
            echo "::error::NPM_TOKEN repository secret is empty or unset"
            exit 1
          fi
          echo "//registry.npmjs.org/:_authToken=${NPM_TOKEN}" > "$HOME/.npmrc"

      - name: publish platform packages
        run: |
          set -euo pipefail
          DRY_FLAG=""
          if [ "$DRY_RUN" = "true" ]; then DRY_FLAG="--dry-run"; fi
          for slug in \
            cli-darwin-arm64 cli-linux-x64 cli-linux-arm64 \
            daemon-darwin-arm64 daemon-linux-x64 daemon-linux-arm64; do
            echo "::group::publish $slug"
            (cd "apps/release/$slug" && npm publish --access public --tag "$NPM_TAG" $DRY_FLAG)
            echo "::endgroup::"
          done

      - name: publish daemon meta
        working-directory: apps/release/daemon
        run: |
          if [ "$DRY_RUN" = "true" ]; then
            npm publish --access public --tag "$NPM_TAG" --dry-run
          else
            npm publish --access public --tag "$NPM_TAG"
          fi

      - name: publish cli meta
        working-directory: apps/release/cli
        run: |
          if [ "$DRY_RUN" = "true" ]; then
            npm publish --access public --tag "$NPM_TAG" --dry-run
          else
            npm publish --access public --tag "$NPM_TAG"
          fi

      - name: create GitHub release
        if: ${{ inputs.dry_run == false }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          gh release create "vellum-cli-v${VERSION}" \
            apps/release/tarballs/*.tar.gz \
            --title "vellum-cli v${VERSION}" \
            --generate-notes

      - name: bump homebrew formula
        if: ${{ inputs.dry_run == false }}
        env:
          HOMEBREW_TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
        run: bun run scripts/bump-homebrew-vellum-formula.ts "$VERSION"

      - name: commit homebrew formula
        if: ${{ inputs.dry_run == false }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add homebrew-tap/Formula/vellum.rb
          git diff --staged --quiet || git commit -m "chore(homebrew): vellum-cli@${VERSION}"
          HUSKY=0 git push origin HEAD
