name: release vellum libs

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Semver to publish for @khoralabs/vellum-client (e.g. 0.1.0)"
        required: true
        type: string
      tag:
        description: "npm dist-tag"
        required: true
        type: choice
        default: latest
        options:
          - latest
          - next
      dry_run:
        description: "Dry-run pack/publish; skip git tag/push"
        required: false
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      VERSION: ${{ inputs.version }}
      NPM_TAG: ${{ inputs.tag }}
      DRY_RUN: ${{ inputs.dry_run }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          # GITHUB_TOKEN cannot clone sibling private org repos (e.g. libs).
          # Submodules are initialized in the next step with KHORALABS_SUBMODULES_TOKEN.

      - name: init submodules
        env:
          # Fine-grained PAT (or classic repo-scoped) with Contents: Read on private
          # khoralabs/libs submodule remote.
          TOKEN: ${{ secrets.KHORALABS_SUBMODULES_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "${TOKEN:-}" ]; then
            echo "::error::KHORALABS_SUBMODULES_TOKEN secret is empty or unset"
            exit 1
          fi
          # scp-style git@host:path URLs often skip url.insteadOf; rewrite to HTTPS first.
          sed -i 's|git@github.com:|https://github.com/|g' .gitmodules
          git config --global url."https://x-access-token:${TOKEN}@github.com/".insteadOf "https://github.com/"
          git submodule sync --recursive
          git submodule update --init --recursive

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: install
        run: bun install --frozen-lockfile

      - name: test
        run: |
          bun test packages/client scripts/publish-package-json.test.ts

      - name: bump client version
        run: |
          node -e "
            const fs = require('node:fs');
            const p = 'packages/client/package.json';
            const pkg = JSON.parse(fs.readFileSync(p, 'utf8'));
            pkg.version = process.env.VERSION;
            fs.writeFileSync(p, JSON.stringify(pkg, null, 2) + '\n');
          "

      - name: build client schema
        run: bun run --cwd packages/client build:schema

      - name: build client
        run: bun run --cwd packages/client build

      - name: configure npm auth
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          if [ -z "${NPM_TOKEN:-}" ]; then
            echo "::error::NPM_TOKEN repository secret is empty or unset"
            exit 1
          fi
          echo "//registry.npmjs.org/:_authToken=${NPM_TOKEN}" > "$HOME/.npmrc"
          echo "NPM_CONFIG_TOKEN=${NPM_TOKEN}" >> "$GITHUB_ENV"

      - name: publish client
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          set -euo pipefail
          if [ "$DRY_RUN" = "true" ]; then
            bun run scripts/publish-client.ts --dry-run --tag "$NPM_TAG"
          else
            bun run scripts/publish-client.ts --tag "$NPM_TAG"
          fi

      - name: commit version bump
        if: ${{ inputs.dry_run == false }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add packages/client/package.json
          git diff --cached --quiet && echo "::warning::version unchanged" && exit 0
          HUSKY=0 git commit -m "release vellum-client v${VERSION}"
          HUSKY=0 git push origin HEAD

      - name: tag and push
        if: ${{ inputs.dry_run == false }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag "vellum-client-v${VERSION}"
          HUSKY=0 git push origin "vellum-client-v${VERSION}"
